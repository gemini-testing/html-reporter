<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Testplane live demo fixture</title>
    <style>
        body {font: 18px sans-serif; margin: 32px; color: #262626; background: #fff}
        #button, #tooltip, #retry-selector, #details-summary {width: 240px; height: 80px; box-sizing: border-box; border: 2px solid #5533dd; background: #e8e2ff; font-size: 0; line-height: 0}
        #tooltip {margin-top: 16px}
        .changed #tooltip {background: #ffe08a; border-color: #a43b00}
    </style>
</head>
<body>
    <h1>Testplane UI demo</h1>
    <main>
        <div id="button">Expand suites</div>
        <div id="tooltip">Expand all suites</div>
        <div id="retry-selector">Retry selector</div>
        <div id="details-summary">Test details summary</div>
    </main>
    <script>
        if (new URLSearchParams(location.search).has('changed')) document.body.classList.add('changed');
    </script>
</body>
</html>
